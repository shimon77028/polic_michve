<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תחנת המשטרה של יחיאל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Noto+Sans+Hebrew:wght@500;700;900&display=swap">
<style>
/* One 16:9 game stage + HTML cards on top. Deliberate single bright "police station" look, explicit backgrounds. */
:root{--navy:#12306b;--blue:#2f6fde;--red:#ff3b4f;--sun:#ffd23f;--paper:#fffdf6;--ink:#14213d;--mint:#5fd38d;
 --fd:"Secular One","Noto Sans Hebrew",system-ui,sans-serif;--fb:"Noto Sans Hebrew",system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 0%,#1f4fa8 0%,var(--navy) 70%);color:var(--ink);font-family:var(--fb);direction:rtl;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;overflow:hidden}
[hidden]{display:none!important}
.wrap{height:100%;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100%,calc((100vh - 20px) * 16 / 9));aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #0b1f47,0 14px 40px rgba(0,0,0,.45);background:#8fd3ff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5%;pointer-events:none}
.ov.side{justify-content:flex-end}
.card{pointer-events:auto;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:12px 14px;width:min(92%,640px);max-height:94%;overflow:auto;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.card.side{width:min(50%,470px);padding:10px}
h1,h2{font-family:var(--fd);font-weight:400;margin:0 0 4px;line-height:1.15;text-wrap:balance;color:var(--navy)}
h2{font-size:clamp(19px,3.2vw,30px)}
p{margin:3px 0 7px;font-size:clamp(13px,2.1vw,18px);font-weight:700}
.rank{display:inline-block;background:#e8f1ff;border:2px solid var(--ink);border-radius:99px;padding:1px 12px;font-weight:900;font-size:clamp(12px,1.9vw,16px);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 8px}
button{font-family:var(--fb);font-weight:900;font-size:clamp(14px,2.2vw,19px);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.go{background:var(--sun)}button.blue{background:var(--blue);color:#fff}button.red{background:var(--red);color:#fff}
.mis{display:flex;align-items:center;gap:8px;padding:5px 8px;text-align:start;font-size:clamp(12px,1.8vw,16px);line-height:1.15}
.mis .ic{font-size:clamp(22px,3.6vw,34px);line-height:1}
.mis small{display:block;color:#d09a00;font-size:clamp(10px,1.5vw,13px);letter-spacing:1px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.lvls button{display:flex;flex-direction:column;align-items:center;padding:10px 6px}
.lvls small{color:#d09a00;letter-spacing:2px;font-size:clamp(14px,2vw,18px)}
.keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin:4px 0;font-weight:700;font-size:clamp(12px,1.8vw,16px)}
.kc{display:inline-flex;min-width:38px;height:38px;align-items:center;justify-content:center;border:3px solid var(--ink);border-bottom-width:6px;border-radius:10px;background:#fff;font-weight:900;font-size:17px;padding:0 6px}
.big{font-size:clamp(30px,6vw,54px);letter-spacing:4px;color:#e0a800;margin:0}
.ctl{position:absolute;bottom:3%;display:flex;gap:16px;direction:ltr;pointer-events:auto}
.ctl button{width:clamp(62px,10.5vw,104px);height:clamp(62px,10.5vw,104px);border-radius:50%;font-size:clamp(24px,4.3vw,42px);padding:0;background:rgba(255,255,255,.8)}
.ctl.l{left:2.5%}.ctl.r{right:2.5%}
.ctl button.wide{width:auto;border-radius:20px;padding:0 16px;font-size:clamp(16px,2.8vw,26px)}
.top{position:absolute;top:2%;right:1.5%;display:flex;gap:6px;pointer-events:auto}
.top button{padding:5px 10px;font-size:clamp(13px,1.8vw,17px);box-shadow:0 3px 0 var(--ink)}
.cars{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.car{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:clamp(11px,1.6vw,14px)}
.car canvas{width:100%;max-width:140px;height:auto;aspect-ratio:2/1}
.car.sel,.hn.sel{background:#e8f1ff;outline:4px solid var(--blue)}
.tip{font-size:clamp(11px,1.6vw,14px);opacity:.8}
button.sm{padding:4px 10px;font-size:clamp(12px,1.8vw,16px);box-shadow:0 3px 0 var(--ink)}
.bigc .ctl button{width:clamp(80px,13.5vw,132px);height:clamp(80px,13.5vw,132px);font-size:clamp(32px,5.6vw,54px)}
.bigc .ctl{gap:22px}
.kids{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.kid{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:clamp(12px,1.9vw,16px)}
.kid .av{width:clamp(40px,7vw,64px);height:clamp(40px,7vw,64px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4.4vw,40px);border:3px solid var(--ink)}
.kid.sel{outline:4px solid var(--blue);background:#e8f1ff}
.kid small{color:#d09a00}
.set{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:5px 0;font-weight:900;font-size:clamp(13px,2vw,17px)}
.set button{padding:4px 10px;font-size:clamp(12px,1.8vw,16px);box-shadow:0 3px 0 var(--ink)}
.set button.on{background:var(--blue);color:#fff}
.who{display:inline-flex;align-items:center;gap:6px}
.who .av{width:30px;height:30px;font-size:18px;border-width:2px}
.lvls.four{grid-template-columns:repeat(4,1fr)}
.card.bare{background:none;border:0;box-shadow:none;align-self:flex-end;width:auto;padding:0 0 1.5%;overflow:visible}
.cutbtn{font-family:var(--fd);font-weight:400;font-size:clamp(22px,4vw,38px);padding:10px 30px;background:linear-gradient(#ffe066,#ffb627);border-width:4px;box-shadow:0 6px 0 var(--ink),0 0 30px rgba(255,210,63,.7);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){button{transition:none}.card{animation:none}.cutbtn{animation:none}}
</style>
<div class="wrap">

  <div class="top" id="top"></div>

 </div>
</div>

 for(const c of I.cars.filter(c=>c.y<400))drawCar(c.c,c.x,c.y,c.s,T,{dir:c.dir,moving:t-c.del<2});
 /* stage + red carpet */
 ctx.fillStyle='#b3122e';ctx.beginPath();ctx.moveTo(430,540);ctx.lineTo(530,540);ctx.lineTo(505,430);ctx.lineTo(455,430);ctx.closePath();ctx.fill();

 for(const c of I.cars.filter(c=>c.y>=400))drawCar(c.c,c.x,c.y,c.s,T,{dir:c.dir,moving:t-c.del<2});
